<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayTracker</title>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --accent: #2c3e50;
            --border: #ddd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .results {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .result-row.total {
            border-top: 1px solid var(--border);
            margin-top: 10px;
            padding-top: 10px;
            font-weight: bold;
            color: #27ae60;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { opacity: 0.8; }
        .history-item {
            background: white;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>New Pay Entry</h2>
        <div class="input-group">
            <label>Gross Pay ($)</label>
            <input type="number" id="grossPay" placeholder="0.00" step="0.01" oninput="calculate()">
        </div>
        
        <div class="results">
            <div class="result-row">
                <span>Tax (34%):</span>
                <span id="taxValue">$0.00</span>
            </div>
            <div class="result-row">
                <span>Investments (6.4%):</span>
                <span id="invValue">$0.00</span>
            </div>
            <div class="result-row">
                <span>Vacation Fund (3.6%):</span>
                <span id="vacValue">$0.00</span>
            </div>
            <div class="result-row total">
                <span>Actual Take-Home:</span>
                <span id="takeHomeValue">$0.00</span>
            </div>
        </div>
        
        <button onclick="saveEntry()">Save to History</button>
    </div>

    <div class="card">
        <h2>Year-to-Date Totals</h2>
        <div id="ytdContainer">
            <div class="result-row"><span>Total Gross:</span> <span id="ytdGross">$0.00</span></div>
            <div class="result-row"><span>Total Take-Home:</span> <span id="ytdNet">$0.00</span></div>
        </div>
    </div>

    <div id="history">
        </div>
</div>

<script>
    const TAX_RATE = 0.34;
    const INV_RATE = 0.064;
    const VAC_RATE = 0.036;

    function calculate() {
        const gross = parseFloat(document.getElementById('grossPay').value) || 0;
        
        const tax = gross * TAX_RATE;
        const inv = gross * INV_RATE;
        const vac = gross * VAC_RATE;
        const net = gross - (tax + inv + vac);

        document.getElementById('taxValue').innerText = `$${tax.toFixed(2)}`;
        document.getElementById('invValue').innerText = `$${inv.toFixed(2)}`;
        document.getElementById('vacValue').innerText = `$${vac.toFixed(2)}`;
        document.getElementById('takeHomeValue').innerText = `$${net.toFixed(2)}`;
        
        return { gross, tax, inv, vac, net };
    }

    function saveEntry() {
        const data = calculate();
        if (data.gross <= 0) return;

        const entry = {
            id: Date.now(),
            date: new Date().toLocaleDateString(),
            ...data
        };

        let history = JSON.parse(localStorage.getItem('payHistory')) || [];
        history.unshift(entry);
        localStorage.setItem('payHistory', JSON.stringify(history));
        
        document.getElementById('grossPay').value = '';
        calculate();
        renderHistory();
    }

    function deleteEntry(id) {
        let history = JSON.parse(localStorage.getItem('payHistory')) || [];
        history = history.filter(item => item.id !== id);
        localStorage.setItem('payHistory', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('payHistory')) || [];
        const container = document.getElementById('history');
        let ytdG = 0;
        let ytdN = 0;

        container.innerHTML = '<h3>History</h3>';
        
        history.forEach(item => {
            ytdG += item.gross;
            ytdN += item.net;
            
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div>
                    <strong>${item.date}</strong><br>
                    <small>Net: $${item.net.toFixed(2)}</small>
                </div>
                <button class="delete-btn" onclick="deleteEntry(${item.id})">Del</button>
            `;
            container.appendChild(div);
        });

        document.getElementById('ytdGross').innerText = `$${ytdG.toFixed(2)}`;
        document.getElementById('ytdNet').innerText = `$${ytdN.toFixed(2)}`;
    }

    // Initialize
    window.onload = renderHistory;
</script>

</body>
</html>
