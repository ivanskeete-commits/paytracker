<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayTracker Pro</title>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --accent: #2c3e50;
            --border: #ddd;
            --success: #27ae60;
            --danger: #e74c3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; font-size: 1.1rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #666; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1rem;
        }
        .results {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #eee;
        }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .result-row.total {
            border-top: 2px solid var(--border);
            margin-top: 10px;
            padding-top: 10px;
            font-weight: bold;
            color: var(--success);
            font-size: 1.1rem;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .history-item {
            background: white;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .data-box {
            font-size: 0.7rem;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            max-height: 60px;
            overflow-y: auto;
            margin-top: 10px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>New Entry</h2>
        <div class="input-group">
            <label>Gross Pay Amount ($)</label>
            <input type="number" id="grossPay" placeholder="0.00" step="0.01" oninput="calculate()">
        </div>
        
        <div class="results">
            <div class="result-row"><span>Tax (34%)</span> <span id="taxValue">$0.00</span></div>
            <div class="result-row"><span>Investments (6.4%)</span> <span id="invValue">$0.00</span></div>
            <div class="result-row"><span>Vacation (3.6%)</span> <span id="vacValue">$0.00</span></div>
            <div class="result-row total"><span>Take-Home</span> <span id="takeHomeValue">$0.00</span></div>
        </div>
        
        <button onclick="saveEntry()" style="margin-top: 15px;">Save Record</button>
    </div>

    <div class="card">
        <h2>2026 YTD Summary</h2>
        <div class="result-row"><span>Total Gross Earned:</span> <strong id="ytdGross">$0.00</strong></div>
        <div class="result-row"><span>Total Net Received:</span> <strong id="ytdNet" style="color: var(--success);">$0.00</strong></div>
    </div>

    <div class="card" style="padding: 0;">
        <div style="padding: 20px 20px 10px 20px;"><h2>History</h2></div>
        <div id="historyList"></div>
    </div>

    <div class="card" style="background: #f9f9f9; border: 1px dashed #ccc;">
        <h2>Backup & Migration</h2>
        <p style="font-size: 0.75rem; color: #666; margin-bottom: 5px;">Copy this text to move history to a new version:</p>
        <div id="rawExport" class="data-box"></div>
    </div>
</div>

<script>
    // UPDATED PERCENTAGES
    const TAX_RATE = 0.34;
    const INV_RATE = 0.064;
    const VAC_RATE = 0.036;

    // EMBEDDED HISTORY (The data you found)
    const EMBEDDED_DATA = [
        {id: 1773084513952, date: "3/9/2026 04:28 PM", amount: 2993.91, isAdj: false, t: 1017.93, i: 191.61, v: 107.78, net: 1676.59},
        {id: 1773084501203, date: "3/9/2026 04:28 PM", amount: 2977.57, isAdj: false, t: 1012.37, i: 190.56, v: 107.19, net: 1667.45},
        {id: 1773084492565, date: "3/9/2026 04:28 PM", amount: 2926.31, isAdj: false, t: 994.95, i: 187.28, v: 105.35, net: 1638.73}
    ];

    function initStorage() {
        if (!localStorage.getItem('payHistory')) {
            localStorage.setItem('payHistory', JSON.stringify(EMBEDDED_DATA));
        }
    }

    function calculate() {
        const gross = parseFloat(document.getElementById('grossPay').value) || 0;
        const tax = gross * TAX_RATE;
        const inv = gross * INV_RATE;
        const vac = gross * VAC_RATE;
        const net = gross - (tax + inv + vac);

        document.getElementById('taxValue').innerText = `$${tax.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('invValue').innerText = `$${inv.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('vacValue').innerText = `$${vac.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('takeHomeValue').innerText = `$${net.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        
        return { gross, tax, inv, vac, net };
    }

    function saveEntry() {
        const data = calculate();
        if (data.gross <= 0) return;

        const entry = {
            id: Date.now(),
            date: new Date().toLocaleString([], {year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}),
            amount: data.gross,
            t: data.tax,
            i: data.inv,
            v: data.vac,
            net: data.net
        };

        let history = JSON.parse(localStorage.getItem('payHistory')) ||
