<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayTracker Recovery</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --accent: #2c3e50;
            --danger: #e74c3c;
            --success: #27ae60;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .recovery-zone {
            background: #fff5f5;
            border: 2px dashed var(--danger);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 1rem; color: var(--accent); }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-main { background: var(--accent); color: white; }
        .btn-recover { background: var(--danger); color: white; font-size: 1.1rem; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1rem;
        }
        .item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .ytd-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card recovery-zone">
        <h2 style="color: var(--danger);">⚠ HISTORY MISSING?</h2>
        <p style="font-size: 0.85rem;">Click below to force-load the March entries into this version.</p>
        <button class="btn btn-recover" onclick="forceLoad()">RECOVER MARCH HISTORY</button>
    </div>

    <div class="card">
        <h2>New Entry (34% Tax / 6.4% Inv)</h2>
        <input type="number" id="gross" placeholder="Enter Gross Pay" oninput="calc()">
        <div id="preview" style="margin-top: 10px; font-size: 0.9rem; color: #666;">
            Take-Home: <span id="th" style="font-weight: bold; color: var(--success);">$0.00</span>
        </div>
        <button class="btn btn-main" onclick="save()">Save to History</button>
    </div>

    <div class="card">
        <h2>Year-to-Date</h2>
        <div class="ytd-row"><span>Gross:</span> <strong id="ytdG">$0.00</strong></div>
        <div class="ytd-row"><span>Net:</span> <strong id="ytdN" style="color: var(--success);">$0.00</strong></div>
    </div>

    <div class="card" style="padding: 0;">
        <div style="padding: 15px;"><h2>History</h2></div>
        <div id="list"></div>
    </div>
</div>

<script>
    const MARCH_DATA = [
        {id: 1773084513952, date: "3/09/2026", amount: 2993.91, net: 1676.59},
        {id: 1773084501203, date: "3/09/2026", amount: 2977.57, net: 1667.45},
        {id: 1773084492565, date: "3/09/2026", amount: 2926.31, net: 1638.73}
    ];

    function forceLoad() {
        localStorage.setItem('payHistory', JSON.stringify(MARCH_DATA));
        render();
        alert("March history recovered!");
    }

    function calc() {
        const g = parseFloat(document.getElementById('gross').value) || 0;
        const net = g * (1 - (0.34 + 0.064 + 0.036));
        document.getElementById('th').innerText = `$${net.toFixed(2)}`;
        return { g, net };
    }

    function save() {
        const { g, net } = calc();
        if (g <= 0) return;
        const entry = { id: Date.now(), date: new Date().toLocaleDateString(), amount: g, net: net };
        let history = JSON.parse(localStorage.getItem('payHistory')) || [];
        history.unshift(entry);
        localStorage.setItem('payHistory', JSON.stringify(history));
        document.getElementById('gross').value = '';
        render();
    }

    function render() {
        const history = JSON.parse(localStorage.getItem('payHistory')) || [];
        const list = document.getElementById('list');
        let gTotal = 0;
        let nTotal = 0;

        list.innerHTML = '';
        history.forEach(item => {
            gTotal += item.amount;
            nTotal += item.net;
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<div><strong>${item.date}</strong></div><div>$${item.net.toFixed(2)}</div>`;
            list.appendChild(div);
        });

        document.getElementById('ytdG').innerText = `$${gTotal.toFixed(2)}`;
        document.getElementById('ytdN').innerText = `$${nTotal.toFixed(2)}`;
    }

    window.onload = render;
</script>

</body>
</html>
